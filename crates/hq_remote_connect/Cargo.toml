[package]
name = "hq_remote_connect"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Parameterized endpoint discovery, one-time QR pairing tickets, and paired-device registry for self-hosted control planes."

[dependencies]
anyhow = "1.0"
base64 = "0.23"
hq_fs_atomic = { path = "../hq_fs_atomic" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
