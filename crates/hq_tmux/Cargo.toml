[package]
name = "hq_tmux"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
hq_fs_atomic = { path = "../hq_fs_atomic" }
hq_runtime_paths = { path = "../hq_runtime_paths" }
portable-pty = "0.8"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["sync", "time"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "time"] }
