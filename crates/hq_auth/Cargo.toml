[package]
name = "hq_auth"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.23"
hex = "0.4"
hmac = "0.13"
hq_fs_atomic = { path = "../hq_fs_atomic" }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1.44", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.44", features = ["macros", "rt"] }
