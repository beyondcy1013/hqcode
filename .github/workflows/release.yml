name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_suffix: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package tarball and checksum
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="hqcode-${TAG}-${{ matrix.asset_suffix }}"
          mkdir -p "dist/${PKG}"
          cp "target/${{ matrix.target }}/release/hqcode" "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/"
          if [ -f README.zh-CN.md ]; then
            cp README.zh-CN.md "dist/${PKG}/"
          fi
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          else
            shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hqcode-${{ matrix.asset_suffix }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
