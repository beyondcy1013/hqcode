<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="HQCode — Your Coding Agents' Headquarters">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="55%" stop-color="#0f1622"/>
      <stop offset="100%" stop-color="#0a1219"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="82%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)" stroke="#242c39" stroke-width="2"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowBlue)"/>
  <!-- Terminal window motif on right -->
  <rect x="760" y="54" width="380" height="212" rx="12" fill="#0d1117" stroke="#2a3444" stroke-width="1.5"/>
  <circle cx="786" cy="76" r="5" fill="#f85149"/>
  <circle cx="804" cy="76" r="5" fill="#d29922"/>
  <circle cx="822" cy="76" r="5" fill="#3fb950"/>
  <text x="846" y="80" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">tmux -L hqcode_s1</text>
  <line x1="760" y1="96" x2="1140" y2="96" stroke="#212834" stroke-width="1"/>
  <text x="782" y="126" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">$ hqcode serve --addr 127.0.0.1:9900</text>
  <text x="782" y="152" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">● claude   [tmux live · desktop + mobile]</text>
  <text x="782" y="178" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">● codex    [zero injection · git diff]</text>
  <text x="782" y="204" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">✓ single Rust binary · ~7.9 MB · RSS ~33 MB</text>
  <text x="782" y="232" fill="#56d364" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">+ ready for handoff on desktop or phone</text>

  <!-- Brand Lockup -->
  <circle cx="84" cy="118" r="13" fill="#3fb950"/>
  <circle cx="84" cy="118" r="22" fill="#3fb950" fill-opacity="0.18"/>
  <text x="118" y="132" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">HQCode</text>
  <text x="72" y="182" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="500">Your Coding Agents' Headquarters</text>
  <text x="72" y="220" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16">Persistent native Claude Code &amp; Codex in tmux — desktop + phone, single Rust binary.</text>
  <rect x="72" y="246" width="122" height="28" rx="14" fill="#161b22" stroke="#2ea043" stroke-width="1"/>
  <text x="133" y="264" text-anchor="middle" fill="#56d364" font-family="ui-monospace, monospace" font-size="12">Rust + tmux</text>
  <rect x="206" y="246" width="142" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="277" y="264" text-anchor="middle" fill="#79c0ff" font-family="ui-monospace, monospace" font-size="12">Terminal I/O Only</text>
  <rect x="360" y="246" width="122" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="421" y="264" text-anchor="middle" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="12">MIT License</text>
</svg>
